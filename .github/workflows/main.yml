name: Run Python Script

on:
  schedule:
      # GitHub Actions cron uses UTC. Every 2 hours at minute 0,
    # corresponding to every 2 hours on the hour in Malaysia (UTC+8).
    - cron: "0 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          
      - name: Run Python script
        run: python airquality.py
      - name: Commit updated air quality data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f hourly_air_quality.csv
          if git diff --cached --quiet; then
            echo "No changes to hourly_air_quality.csv"
          else
            git commit -m "Update hourly air quality data"
            git push
          fi

